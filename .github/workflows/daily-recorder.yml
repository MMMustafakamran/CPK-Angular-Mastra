name: Daily Auto-Update and Demo Recording

# GitHub allows a workflow_dispatch at most 10 INPUTS. This form uses 9, so
# there is room for exactly one more. Section checkboxes rather than per-page
# ones are what keep it under the cap as pages are added.
#
# Sections map to page ids in ci/lib/pages.mjs (PAGE_GROUPS). A page belonging
# to no section fails the run, so nothing becomes silently unreachable here.

on:
  schedule:
    # Every day at 06:00 UTC (11:00 AM PKT).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      group_getting_started:
        description: 'Getting Started — Quickstart, Chat UI'
        type: boolean
        default: false
      group_generative_ui:
        description: 'Generative UI — Frontend Tools & Generative UI, A2UI'
        type: boolean
        default: false
      group_interaction:
        description: 'Interaction — Voice & Multimodal, Human in the Loop'
        type: boolean
        default: false
      group_shared_state:
        description: 'Shared State'
        type: boolean
        default: false
      group_threads:
        description: 'Threads, Memory, Attachments, Headless'
        type: boolean
        default: false
      pages:
        description: 'Exact page ids, comma-separated (added to any sections ticked above). Blank + nothing ticked = all pages.'
        required: false
        type: string
        default: ''
      use_lockfile:
        description: 'Install the committed lockfiles instead of re-resolving. Off by default: a normal run picks up the newest versions package.json already allows.'
        required: false
        type: boolean
        default: false
      fail_on_doc_drift:
        description: 'Fail immediately if the live docs have drifted (the nightly run always does)'
        required: false
        type: boolean
        default: false
      custom_args:
        description: 'Extra recorder args (e.g. --limit=5). Overrides every selection above.'
        required: false
        type: string
        default: ''

concurrency:
  group: daily-recorder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve the run name and the page selection once, so every shard agrees and
  # a bad selection fails in seconds instead of after three servers boot.
  prepare:
    name: Resolve run name & page selection
    runs-on: ubuntu-latest
    outputs:
      run_name: ${{ steps.meta.outputs.run_name }}
      pages: ${{ steps.meta.outputs.pages }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: meta
        env:
          INPUT_PAGES: ${{ inputs.pages }}
        run: |
          set -euo pipefail

          RUN_NAME="$(node ci/run-name.mjs)"
          echo "run_name=$RUN_NAME" >> "$GITHUB_OUTPUT"
          echo "Artifacts will be named: $RUN_NAME"

          SEL_GROUPS=""
          add_group() { [ "$1" = "true" ] && SEL_GROUPS="${SEL_GROUPS:+$SEL_GROUPS,}$2" || true; }
          add_group "${{ inputs.group_getting_started }}" getting_started
          add_group "${{ inputs.group_generative_ui }}"   generative_ui
          add_group "${{ inputs.group_interaction }}"     interaction
          add_group "${{ inputs.group_shared_state }}"    shared_state
          add_group "${{ inputs.group_threads }}"         threads

          PAGES="$(node ci/resolve-selection.mjs --pages="${INPUT_PAGES:-}" --groups="$SEL_GROUPS")"
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"

          {
            echo "### 🎬 $RUN_NAME"
            if [ -n "$PAGES" ]; then
              echo "Recording: \`$PAGES\`"
            else
              echo "Recording: **all pages**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  record-workers:
    name: Worker ${{ matrix.shard }}/3
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # No Python and no uv: the Mastra agent is TypeScript, imported as source
      # by frontend/server.ts and run inside the Copilot Runtime process.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            autorecorder/package-lock.json

      # The runner's Node 22 ships npm 10, but these frontends pin npm 12 in
      # `packageManager`. That gap is not cosmetic: npm 10 cannot resolve the
      # `"rxjs": "$rxjs"` reference in the frontend's `overrides`, so a
      # lockfile-free install — which is what a normal run performs — dies
      # on `Unable to resolve reference $rxjs`. Read the pin rather than
      # restating it, so bumping package.json cannot leave CI behind again.
      - name: Use the npm version the frontend pins
        run: |
          set -euo pipefail
          PINNED="$(node -p "require('./frontend/package.json').packageManager")"
          echo "Runner has npm $(npm --version); frontend pins $PINNED"
          npm install -g "$PINNED"
          npm --version

      - name: Install Playwright & System Chromium Dependencies
        run: |
          cd autorecorder
          npm install
          npx playwright install --with-deps chromium

      # ffmpeg lives here, not in consolidate, because muxing happens once — in
      # the worker that produced the video.
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Record demos (shard ${{ matrix.shard }}/3)
        env:
          SELECTED_PAGES: ${{ needs.prepare.outputs.pages }}
          INPUT_CUSTOM_ARGS: ${{ inputs.custom_args }}
          INPUT_USE_LOCKFILE: ${{ inputs.use_lockfile }}
          INPUT_FAIL_ON_DRIFT: ${{ inputs.fail_on_doc_drift }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_CUSTOM_ARGS:-}" ]; then
            RECORD_ARGS="${INPUT_CUSTOM_ARGS}"
          elif [ -n "${SELECTED_PAGES:-}" ]; then
            RECORD_ARGS="--pages=${SELECTED_PAGES} --shard=${SHARD}/3"
          else
            RECORD_ARGS="--shard=${SHARD}/3"
          fi

          EXTRA_FLAGS=""
          if [ "${INPUT_USE_LOCKFILE:-false}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --use-lockfile"
          fi
          # The nightly run halts on doc drift, and is not asked. A recording is
          # only useful as documentation of a page that still says what it said
          # when the snapshot was taken; once the live doc moves, an unattended
          # run would publish clips of a demo that no longer matches it, and
          # nobody is watching to notice. Drift on a schedule is a signal to
          # update doc-snapshot/, not something to record through.
          #
          # A manual run is attended, so there it stays opt-in: tick
          # 'Fail immediately if the live docs have drifted' to get the same
          # behaviour when you want it.
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ] || [ "${INPUT_FAIL_ON_DRIFT:-false}" = "true" ]; then
            echo "Doc drift will halt this run."
          else
            EXTRA_FLAGS="$EXTRA_FLAGS --ignore-doc-drift"
          fi

          echo "Shard ${SHARD}/3 flags: $EXTRA_FLAGS $RECORD_ARGS"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node ci/automate.mjs $EXTRA_FLAGS $RECORD_ARGS

      - name: Publish Shard Report to GitHub Summary
        if: always()
        run: |
          if [ -f "autorecorder/videos/RUN_REPORT.md" ]; then
            echo "### 🧩 Worker Shard ${{ matrix.shard }}/3 Summary" >> $GITHUB_STEP_SUMMARY
            cat autorecorder/videos/RUN_REPORT.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🧩 Worker Shard ${{ matrix.shard }}/3 produced no report" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Shard Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.run_name }}-shard-${{ matrix.shard }}
          path: |
            autorecorder/videos/*.webm
            autorecorder/videos/RUN_REPORT.md
            autorecorder/videos/RUN_REPORT.json
            autorecorder/videos/logs/*.log
          if-no-files-found: ignore
          retention-days: 14

  consolidate-recordings:
    name: Consolidate & Merge All Video Artifacts
    needs: [prepare, record-workers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-recordings
          pattern: ${{ needs.prepare.outputs.run_name }}-shard-*
          merge-multiple: true

      # One folder holding every clip from the run, named for the project and
      # the time it ran.
      - name: Upload Consolidated Demo Recordings Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.run_name }}
          path: all-recordings/
          if-no-files-found: ignore
          retention-days: 14

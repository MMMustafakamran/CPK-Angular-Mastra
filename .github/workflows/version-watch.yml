name: Version Watch

# Deliberately separate from daily-recorder.yml. Three reasons:
#
#   1. Cost. The recorder dispatches three sharded workers that boot the whole
#      stack and spend real model calls. Asking "what moved overnight?" should
#      not cost that, and should be runnable on its own from the Actions tab.
#   2. Blast radius. This job needs `contents: write` to commit the snapshot.
#      The recorder holds the model API keys. Keeping write access out of the
#      workflow that holds the keys is worth one extra file.
#   3. Meaning. A moved version is news, not a build failure. It must never gate
#      whether demos record, and its red must not be confused with theirs.
#
# See ci/VERSION-WATCH.md for what the report contains and why it classifies
# rather than lists.

on:
  schedule:
    # 05:30 UTC — half an hour ahead of the recorder, so the morning summary
    # already says what moved before the recordings are judged against it.
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      commit_snapshot:
        description: 'Commit the resolved-version snapshot (scheduled runs always do)'
        required: false
        type: boolean
        default: false

concurrency:
  group: version-watch
  cancel-in-progress: false

jobs:
  version-watch:
    name: Report dependency drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Scoped by the commit step to ci/resolved-versions.json alone.
      # package.json and the lockfiles are never touched by this job.
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same reason as the recorder: a lockfile-free install needs the npm the
      # frontend pins, or `"rxjs": "$rxjs"` in `overrides` fails to resolve.
      - name: Use the npm version the frontend pins
        run: |
          set -euo pipefail
          PINNED="$(node -p "require('./frontend/package.json').packageManager")"
          echo "Runner has npm $(npm --version); frontend pins $PINNED"
          npm install -g "$PINNED"

      # Resolve exactly the way a normal recording run does (ci/automate.mjs
      # drops the lockfiles by default), so the snapshot describes the versions
      # the demos are actually recorded against. Three workspaces here, not two:
      # the Mastra agent is a Node project the recorder installs the same way.
      - name: Re-resolve dependencies
        run: |
          set -euo pipefail
          rm -f frontend/package-lock.json backend/package-lock.json autorecorder/package-lock.json
          npm --prefix backend install --no-audit --no-fund
          npm --prefix frontend install --no-audit --no-fund
          npm --prefix autorecorder install --no-audit --no-fund

      - name: Report drift and snapshot resolved versions
        run: node ci/check-versions.mjs --snapshot | tee -a "$GITHUB_STEP_SUMMARY"

      # git history is the version timeline: when a recording breaks today but
      # not yesterday, `git log -p ci/resolved-versions.json` names the change.
      - name: Commit the snapshot if it moved
        if: github.event_name == 'schedule' || inputs.commit_snapshot
        run: |
          set -euo pipefail
          # Stage BEFORE asking whether anything moved. `git diff` ignores
          # untracked files, so on the very first run — the one establishing the
          # baseline — it reports no change and the snapshot is thrown away.
          # Staging first makes the new file visible to the check.
          git add -- ci/resolved-versions.json
          if git diff --cached --quiet -- ci/resolved-versions.json; then
            echo "No version movement to record."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): record resolved dependency versions'

          # A protected default branch rejects this push. That is a repo-settings
          # answer, not a broken run: the report above is already published
          # either way, so say so in the summary and leave the job green.
          if ! git push; then
            {
              echo '### ⚠️ Version snapshot not recorded'
              echo
              echo 'The push was rejected — most likely branch protection.'
              echo 'The report above still stands, but without a committed snapshot'
              echo 'there is no day-to-day diff. Either allow this job to push, or'
              echo 'switch this step to open a PR instead.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
